services:
  - type: web
    name: referral-monitor
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SCRAPE_CREATORS_API_KEY
        sync: false
      - key: SCRAPE_CREATORS_TIMEOUT_SECONDS
        value: 30
      - key: REFERRAL_SEARCH_TERM
        value: claude.ai/referral
      - key: SEARCH_INCLUDE_BROAD_KEYWORDS
        value: false
      - key: THREADS_WATCH_INTERVAL_SECONDS
        value: 300
      - key: THREADS_LOOKBACK_MINUTES
        value: 7
      - key: THREADS_QUERIES
        value: claude.ai/referral
      - key: REDDIT_WATCH_INTERVAL_SECONDS
        value: 300
      - key: REDDIT_LOOKBACK_MINUTES
        value: 7
      - key: REDDIT_QUERIES
        value: claude.ai/referral
      - key: REDDIT_SCRAPE_FILTER
        value: posts
      - key: REDDIT_SCRAPE_TIMEFRAME
        value: day
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_TIMEOUT_SECONDS
        value: 150
      - key: APIFY_MAX_RUN_COST_USD
        value: 0.10
      - key: APIFY_FACEBOOK_ACTOR_ID
        value: memo23~facebook-search-scraper
      - key: APIFY_INSTAGRAM_ACTOR_ID
        value: scraping_solutions~instagram-boolean-search-scraper-posts-reels
      - key: APIFY_RENDER_AUTO_DEPLOY
        value: false
      - key: INSTAGRAM_WATCH_INTERVAL_SECONDS
        value: 300
      - key: INSTAGRAM_LOOKBACK_MINUTES
        value: 17
      - key: INSTAGRAM_QUERIES
        value: claude.ai/referral
      - key: INSTAGRAM_SEARCH_LIMIT
        value: 10
      - key: INSTAGRAM_CONTENT_TYPE
        value: posts_and_reels
      - key: INSTAGRAM_SEARCH_COVERAGE
        value: efficient
      - key: INSTAGRAM_HASHTAG_FEED_TYPE
        value: recent
      - key: FACEBOOK_WATCH_INTERVAL_SECONDS
        value: 300
      - key: FACEBOOK_LOOKBACK_MINUTES
        value: 12
      - key: FACEBOOK_QUERIES
        value: claude.ai/referral
      - key: FACEBOOK_SEARCH_LIMIT
        value: 10
      - key: FACEBOOK_PAGE_DELAY_MS
        value: 800
      - key: TELEGRAM_ADMIN_CHAT_IDS
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright
      - key: VALIDATOR_BROWSER_PROFILE_DIR
        value: /tmp/referral-browser-profile
      - key: VALIDATOR_BROWSER_CHALLENGE_WAIT_SECONDS
        value: 5
      - key: VALIDATOR_BROWSER_FALLBACK_ENABLED
        value: false
      - key: VALIDATOR_PROXY_URL
        sync: false
      - key: VALIDATION_QUEUE_POLL_SECONDS
        value: 2
      - key: VALIDATION_QUEUE_WORKERS
        value: 3
      - key: VALIDATION_MAX_ATTEMPTS
        value: 1
      - key: THREADS_RENDER_API_KEY
        sync: false
      - key: THREADS_RENDER_SERVICE_ID
        sync: false
      - key: THREADS_RENDER_AUTO_DEPLOY
        value: true
      - key: YOUTUBE_WATCH_INTERVAL_SECONDS
        value: 1200
      - key: YOUTUBE_LOOKBACK_MINUTES
        value: 360
      - key: YOUTUBE_QUERIES
        value: claude.ai/referral|claude referral|claude guest pass
      - key: YOUTUBE_DAILY_SEARCH_QUOTA
        value: 100
      - key: EXA_SEARCH_PRICE_USD
        value: 0.007
      - key: WEB_DIRECT_SOURCES
        sync: false
      - key: WEB_DIRECT_WATCH_INTERVAL_SECONDS
        value: 120
      - key: PODCAST_TRANSCRIPT_RETRIES
        value: 2
